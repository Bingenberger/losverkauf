# nginx-Site für den Losverkauf – wird von server-einrichten.sh nach
# /etc/nginx/sites-available/@DIENST@ geschrieben (Platzhalter @…@ werden ersetzt).
# certbot ergänzt anschließend automatisch "listen 443 ssl", die Zertifikate und die
# Weiterleitung von http auf https. Bei erneuter Einrichtung wird die Datei nicht überschrieben.

# Schutz vor Massen-Anmeldungen und Passwort-Raten (je IP-Adresse, getrennte Zonen)
limit_req_zone $binary_remote_addr zone=@DIENST@_anmeldung:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=@DIENST@_login:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    client_max_body_size 64k;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/@DIENST@.access.log;
    error_log  /var/log/nginx/@DIENST@.error.log;

    # Statische Dateien (Karte, CSS, JS, GeoJSON) liefert nginx direkt aus
    location /static/ {
        alias @ZIEL@/static/;
        expires 1h;
        access_log off;
    }

    location = /api/anmeldung {
        limit_req zone=@DIENST@_anmeldung burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:@PORT@;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /admin/login {
        limit_req zone=@DIENST@_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:@PORT@;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Alles andere geht an die Flask-App (Gunicorn)
    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
